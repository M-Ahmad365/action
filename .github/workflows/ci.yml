name: My first GitHub Action
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: setthing up of the python
        uses: actions/setup-python@v4
        with: 
            python-version: "3.12"

      - name: python program
        run: python hello.py

      - name: Check Python Syntax
        run: python -m py_compile hello.py


