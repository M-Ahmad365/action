
name: My First GitHub Action

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Run Python Checks
        run: |
          echo "Starting CI..."
          python hello.py
          python -m py_compile hello.py
          echo "All checks passed!"
